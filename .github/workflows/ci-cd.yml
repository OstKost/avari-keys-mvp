name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
    inputs:
      target:
        description: 'Компонент для деплоя на продакшене'
        required: true
        default: 'all-slaves'
        type: choice
        options:
          - 'all'
          - 'all-slaves'
          - 'slave-api'
          - 'master-api'
          - 'frontend-only'
      target_host:
        description: 'IP/Хост целевого VPS (по умолчанию Master M0)'
        required: false
        default: '157.22.252.225'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  # ==========================================
  # 1. Сборка, линтинг и тестирование
  # ==========================================
  test-and-build:
    name: 🧪 Test & Build Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐹 Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache-dependency-path: apps/backend/go.sum

      - name: 📦 Go Vet & Tests
        working-directory: apps/backend
        run: |
          go vet ./...
          go test -v -race ./...

      - name: 🏗️ Compile Static Linux (amd64) Binaries
        working-directory: apps/backend
        run: |
          mkdir -p ../../dist/linux-amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../../dist/linux-amd64/avari-master ./cmd/master
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../../dist/linux-amd64/avari-slave ./cmd/slave
          chmod +x ../../dist/linux-amd64/avari-master ../../dist/linux-amd64/avari-slave

      - name: ⚡ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies & Build SPA
        working-directory: apps/frontend
        run: |
          npm ci
          npm run build

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: avari-build-artifacts
          retention-days: 1
          path: |
            dist/linux-amd64/avari-master
            dist/linux-amd64/avari-slave
            apps/frontend/dist/

  # ==========================================
  # 2. Деплой Frontend SPA (Автоматически на push в main или вручную)
  # ==========================================
  deploy-frontend:
    name: 🌐 Deploy Frontend (Web SPA)
    needs: test-and-build
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'frontend-only'))
    runs-on: ubuntu-latest
    concurrency:
      group: production-frontend-deploy
      cancel-in-progress: false

    steps:
      - name: 📥 Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: avari-build-artifacts
          path: deploy-artifacts

      - name: 🔑 Configure SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST || '157.22.252.225' }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "❌ Error: Secret SSH_PRIVATE_KEY is not defined in GitHub repository secrets."
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 📦 Sync Frontend Static Files (Atomic Swap)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || '157.22.252.225' }}
          SSH_USER: ${{ secrets.SSH_USER || 'root' }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          RUN_ID: ${{ github.run_id }}
        run: |
          DEPLOY_TMP="/tmp/avari-front-${RUN_ID}"
          SSH_CMD="ssh -i ~/.ssh/id_deploy -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new ${SSH_USER}@${SSH_HOST}"
          RSYNC_CMD="rsync -avz --delete -e \"ssh -i ~/.ssh/id_deploy -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new\""

          echo "==> Creating temporary frontend staging folder..."
          $SSH_CMD "mkdir -p ${DEPLOY_TMP} /var/www/avari-keys/frontend"

          echo "==> Uploading Frontend build to staging..."
          eval $RSYNC_CMD deploy-artifacts/apps/frontend/dist/ ${SSH_USER}@${SSH_HOST}:${DEPLOY_TMP}/

          echo "==> Applying frontend update..."
          $SSH_CMD "bash -se" << EOF
            set -euo pipefail
            rsync -av --delete ${DEPLOY_TMP}/ /var/www/avari-keys/frontend/
            rm -rf ${DEPLOY_TMP}
            if systemctl is-active --quiet caddy; then
              echo "Reloading caddy..."
              systemctl reload caddy || true
            fi
          EOF
          echo "✅ Frontend successfully updated!"

      - name: 🧹 Cleanup SSH Credentials
        if: always()
        run: rm -rf ~/.ssh/id_deploy

  # ==========================================
  # 3. Деплой Backend API (Только ручной запуск workflow_dispatch)
  # ==========================================
  deploy-backend:
    name: ⚙️ Deploy Backend API (Manual Trigger)
    needs: test-and-build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.target == 'all' || github.event.inputs.target == 'all-slaves' || github.event.inputs.target == 'master-api' || github.event.inputs.target == 'slave-api')
    runs-on: ubuntu-latest
    concurrency:
      group: production-backend-deploy
      cancel-in-progress: false

    steps:
      - name: 📥 Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: avari-build-artifacts
          path: deploy-artifacts

      - name: 🔑 Configure SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ github.event.inputs.target_host || secrets.SSH_HOST || '157.22.252.225' }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "❌ Error: Secret SSH_PRIVATE_KEY is not defined in GitHub repository secrets."
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 🚀 Deploy Selected Binaries & Restart Services
        env:
          TARGET: ${{ github.event.inputs.target }}
          TARGET_HOST: ${{ github.event.inputs.target_host || secrets.SSH_HOST || '157.22.252.225' }}
          SSH_USER: ${{ secrets.SSH_USER || 'root' }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          RUN_ID: ${{ github.run_id }}
        run: |
          DEPLOY_TMP="/tmp/avari-backend-${RUN_ID}"

          # Multi-slave deployment
          if [ "${TARGET}" = "all-slaves" ]; then
            SLAVE_HOSTS="157.22.252.225 185.213.240.136 157.228.142.20 157.228.130.7"
            for HOST in ${SLAVE_HOSTS}; do
              echo "=================================================="
              echo "==> Deploying avari-slave to ${HOST}..."
              echo "=================================================="
              ssh -i ~/.ssh/id_deploy -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new ${SSH_USER}@${HOST} "mkdir -p ${DEPLOY_TMP} /usr/local/bin /opt/avari-keys/data"
              scp -i ~/.ssh/id_deploy -P ${SSH_PORT} -o StrictHostKeyChecking=accept-new deploy-artifacts/dist/linux-amd64/avari-slave ${SSH_USER}@${HOST}:${DEPLOY_TMP}/avari-slave
              ssh -i ~/.ssh/id_deploy -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new ${SSH_USER}@${HOST} "bash -se" << 'EOF'
                set -e
                install -m 755 /tmp/avari-backend-*/avari-slave /usr/local/bin/avari-slave
                rm -rf /tmp/avari-backend-*
                systemctl daemon-reload
                if systemctl is-active --quiet avari-slave; then
                  systemctl restart avari-slave
                  echo "✅ avari-slave restarted successfully!"
                else
                  echo "ℹ️ avari-slave is not active on this host, skipping restart."
                fi
EOF
            done
            echo "🎉 All slave nodes successfully deployed!"
            exit 0
          fi

          SSH_CMD="ssh -i ~/.ssh/id_deploy -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new ${SSH_USER}@${TARGET_HOST}"
          SCP_CMD="scp -i ~/.ssh/id_deploy -P ${SSH_PORT} -o StrictHostKeyChecking=accept-new"

          echo "==> Target action: ${TARGET} on host: ${TARGET_HOST}"
          $SSH_CMD "mkdir -p ${DEPLOY_TMP} /usr/local/bin /opt/avari-keys/data"

          if [ "${TARGET}" = "all" ] || [ "${TARGET}" = "master-api" ]; then
            echo "==> Uploading avari-master binary to ${TARGET_HOST}..."
            $SCP_CMD deploy-artifacts/dist/linux-amd64/avari-master ${SSH_USER}@${TARGET_HOST}:${DEPLOY_TMP}/avari-master
            $SSH_CMD "chmod +x ${DEPLOY_TMP}/avari-master && install -m 755 ${DEPLOY_TMP}/avari-master /usr/local/bin/avari-master"
            
            echo "==> Restarting avari-master service..."
            $SSH_CMD "systemctl daemon-reload && systemctl restart avari-master"
            sleep 2
            $SSH_CMD "systemctl is-active avari-master"
            echo "✅ avari-master is active and running!"
          fi

          if [ "${TARGET}" = "all" ] || [ "${TARGET}" = "slave-api" ]; then
            echo "==> Uploading avari-slave binary to ${TARGET_HOST}..."
            $SCP_CMD deploy-artifacts/dist/linux-amd64/avari-slave ${SSH_USER}@${TARGET_HOST}:${DEPLOY_TMP}/avari-slave
            $SSH_CMD "chmod +x ${DEPLOY_TMP}/avari-slave && install -m 755 ${DEPLOY_TMP}/avari-slave /usr/local/bin/avari-slave"

            echo "==> Restarting avari-slave service (if active/configured)..."
            $SSH_CMD "bash -se" << 'EOF'
              systemctl daemon-reload
              if systemctl is-active --quiet avari-slave; then
                systemctl restart avari-slave
                echo "✅ avari-slave restarted successfully!"
              else
                echo "ℹ️ avari-slave is not active on this host, skipping service restart."
              fi
EOF
          fi

          echo "==> Cleaning up temporary staging directory..."
          $SSH_CMD "rm -rf ${DEPLOY_TMP}"
          echo "🎉 Backend deployment completed successfully!"

      - name: 🧹 Cleanup SSH Credentials
        if: always()
        run: rm -rf ~/.ssh/id_deploy

